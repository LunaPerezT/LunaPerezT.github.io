<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    />
    <meta name="author" content="Luna Pérez Troncoso" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0C0F18" media="(prefers-color-scheme: dark)" />
    <link rel="canonical" href="https://lunaperezt.github.io/" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lunaperezt.github.io/" />
    <meta property="og:title" content="Luna Pérez Troncoso | Data Scientist &amp; AI Engineer" />
    <meta
      property="og:description"
      content="Diez proyectos de data science e IA — de pipelines Spark sobre 124.000 latidos a agentes LLM con MCP y modelos desplegados en AWS. Con las cifras verificadas y sus caveats."
    />
    <meta property="og:site_name" content="Luna Pérez Troncoso" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:locale:alternate" content="en_GB" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Luna Pérez Troncoso | Data Scientist &amp; AI Engineer" />
    <meta
      name="twitter:description"
      content="Diez proyectos de data science, machine learning e IA generativa, con métricas verificadas y limitaciones declaradas."
    />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- Typography: Fraunces (display) · Inter (UI) · JetBrains Mono (numbers) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />

    <script>
      // Apply the stored theme before first paint so the page never flashes.
      // Dark is the default: light only when the visitor has chosen it here.
      // This must stay in sync with readInitialTheme() in ThemeContext.tsx.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("luna-theme");
        } catch (e) {
          /* private mode or storage disabled: fall through to the default */
        }
        if (stored !== "light") {
          document.documentElement.classList.add("dark");
        }
      })();

      // GitHub Pages serves 404.html for deep links; it stashes the path here.
      (function () {
        var redirect = sessionStorage.getItem("spa-redirect");
        if (redirect) {
          sessionStorage.removeItem("spa-redirect");
          if (redirect !== location.pathname + location.search + location.hash) {
            history.replaceState(null, "", redirect);
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
